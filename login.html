<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | TicketForge</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <h1>Welcome Back 👋</h1>
    <p class="subtitle">Log in to manage your tickets efficiently.</p>
    <form id="loginForm" novalidate>
      <div class="input-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
        <span class="error" id="loginEmailError"></span>
      </div>
      <div class="input-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
        <span class="error" id="loginPasswordError"></span>
      </div>
      <button type="submit" class="btn primary full">Login</button>
      <p class="switch-link">Don't have an account? <a href="signup.html">Sign up</a></p>
      <p class="switch-link"><a href="index.html">← Back to home</a></p>
    </form>
  </div>
  <div id="toast" class="toast"></div>
  <script src="common.js"></script>
  <script src="auth.js"></script>
</body>
</html>
