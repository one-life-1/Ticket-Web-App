<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | TicketForge</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <h1>Create Account 🚀</h1>
    <p class="subtitle">Join TicketForge and start managing tickets smarter.</p>
    <form id="signupForm" novalidate>
      <div class="input-group">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="John Doe" autocomplete="name" required>
        <span class="error" id="signupNameError"></span>
      </div>
      <div class="input-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" required>
        <span class="error" id="signupEmailError"></span>
      </div>
      <div class="input-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="••••••••" autocomplete="new-password" required>
        <span class="error" id="signupPasswordError"></span>
      </div>
      <button type="submit" class="btn primary full">Sign Up</button>
      <p class="switch-link">Already have an account? <a href="login.html">Login</a></p>
      <p class="switch-link"><a href="index.html">← Back to home</a></p>
    </form>
  </div>
  <div id="toast" class="toast"></div>
  <script src="common.js"></script>
  <script src="auth.js"></script>
</body>
</html>
